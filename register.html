<!DOCTYPE html>
<html>
<head>
  <title>Registration - Fulfilled Hand</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<script src="script.js"></script>
<nav>
  <div class="logo">FULFILLED HAND</div>
  <ul>
    <li><a href="index.html">Home</a></li>
    <li><a href="about.html">About</a></li>
    <li><a href="courses.html">Courses</a></li>
    <li><a href="register.html" class="active">Register</a></li>
  </ul>
</nav>

<div class="container">
  <h2 class="title">Student Registration Form</h2>
  
  <div id="successMsg" style="display:none; background:white; max-width:600px; margin:auto; padding:30px; border-radius:15px; text-align:center; box-shadow: 0 5px 20px rgba(0,0,0,0.08);"></div>

  <form id="regForm">
    <label>Full Name</label>
    <input type="text" id="fullName" placeholder="e.g Miracle Ukanya" required>

    <div class="row">
      <div>
        <label>Date of Birth</label>
        <input type="date" id="dob" required>
      </div>
      <div>
        <label>Gender</label>
        <select id="gender" required>
          <option value="">Select Gender</option>
          <option>Male</option>
          <option>Female</option>
          <option>Prefer not to say</option>
        </select>
      </div>
    </div>

    <div class="row">
      <div>
        <label>Phone Number</label>
        <input type="tel" id="phone" placeholder="08012345678" required>
      </div>
      <div>
        <label>Email Address</label>
        <input type="email" id="email" placeholder="example@gmail.com" required>
      </div>
    </div>

    <label>Course Selection</label>
    <select id="course" required>
      <option value="">-- Choose a Course --</option>
      <option>JAMB / UTME Intensive</option>
      <option>Web Development</option>
      <option>Python Programming</option>
      <option>Graphics & UI/UX Design</option>
    </select>

    <button type="submit" class="submit-btn">Submit Registration</button>
  </form>
</div>

<footer>© 2026 Fulfilled Hand Learning Centre</footer>
<script src="script.js"></script>
</body>
</html>
